`concepts/` | 概念頁（KV cache、prefix caching…） | 每條事實引用 claim id，不寫來源沒說的話 |\n| `claims.json` | 主張帳本（claim ledger） | 每個 claim 有 id、來源、數字清單、驗證狀態；簡報只能引用帳本裡的 claim |\n| `lint/` | lint 報告與衝突紀錄 | 來源之間不一致時「不覆蓋」，記錄並說明採用哪個 |\n| `log.md` | ingest 與討論紀錄 | 每次 ingest 一筆 |\n\n## 標註規則（最重要）\n1. 每一條事實以 `[C##]` 標註 claim id；來源用 `[S#]`。沒有來源的句子不能放進概念頁，只能放在標示「（解說）」的段落。\n2. **數字必須在「已抓取的一手來源全文」中找到。** 只在搜尋摘要、部落格、轉載頁看到的數字，只能當線索，不得進入帳本。\n3. 二手來源（部落格、第三方文件）不能當證據；它們與一手來源衝突時，以一手來源為準，並記進 `lint/conflicts.md`。\n4. 同一篇論文內部若出現不同數字（例如摘要 vs 內文），兩個都記，並註明各自的脈絡。\n5. 廠商文件（例如 Anthropic）會變動，必須記錄取得日期，簡報中的價格類數字要標示「以官方文件為準」。\n6. 術語依 `concepts/terminology.md`；同一個詞不得代表兩種東西。\n\n## 流程：先討論、後生成\n1. **討論（discuss）**：決定這份來源要抽哪些重點、可能的術語衝突、與既有頁面的關係。結論寫進 `log.md` 的「討論」欄。\n2. **生成（generate）**：寫來源頁 → 新增 claims 到帳本 → 更新概念頁 → 更新 `index.md` 與 `log.md`。\n3. **lint**：執行 `tools/check.py`，檢查標註完整性、連結、數字是否出現在帳本。\n\n## 版本\n- v1（計畫）：只在簡報完成後，才逐頁回頭對照 Wiki。\n- v2（本次執行中修改）：蒐集來源時發現搜尋摘要、二手文章與論文全文的數字不一致，因此在寫入 Wiki 之前加入「數字須有一手全文佐證」（規則 2）與 claim 帳本 `claims.json`，並新增 `tools/check.py`，讓簡報逐頁檢查變成機械式比對。原因與紀錄見 `logs/run-001.md`。"}, "kv-cache": {"title": "KV cache", "path": "concepts/kv-cache.md", "desc": "KV cache 是什麼、prefill 與 decode 兩階段、為什麼可以快取而不影響準確度、以及記憶體代價（初學者主頁）", "md": "# KV cache（單一請求內的快取）\n\n## 一句話\nLLM 一次生成一個 token；生成每個新 token 都要用到「前面所有 token 的 key 與 value」。把這些 K、V 算一次就存起來、之後直接取用，就是 KV cache。\n\n## 不用快取會怎樣\n- [C02] 自回歸生成時，若不快取，每一步模型都以整個 prompt 加上已生成的 tokens 當輸入，attention states 全部重算。 [S3]\n\n## 用了快取會怎樣\n- [C01] 每個 token 的 K、V 只算一次，之後重用。 [S3]\n- [C03] 先對輸入算好 K、V 並存起來（prefill phase）；之後每一步沿用快取，只算新 token 的 K、V 並附加進去（decode）。 [S3]\n- [C35] 每一步的運算量約由 6nd²+4n²d 降為 6d²+4nd（n：序列長度，d：hidden size）。 [S3]\n- [C04] 在因果語言模型中，使用 KV cache 不影響準確度，因為位置 i 的 attention 只依賴它前面的 tokens。 [S3]\n\n## prefill 為什麼會慢\n- [C33] 4K tokens 的輸入，在單張 A40 上 Llama-34B 的 prefill 約需 3 秒、Llama-70B 約 6 秒。 [S4]\n- [C41] 使用者等到第一個字出現的時間稱為 TTFT；prefill 的延遲決定 TTFT。 [S4]\n\n## 代價：記憶體\n- [C06] 以 13B 模型跑在 40GB 的 A100 為例，約 65% 的記憶體是不變的模型權重；KV cache 隨每個請求配置與釋放，它怎麼被管理決定了最大 batch size。 [S1]\n- [C07] 每個 token 的 KV cache 約佔：Falcon 1B 0.18 MB、Llama 7B 0.50 MB、Llama 70B 2.5 MB（16-bit）；Llama 70B 快取一個 1K tokens 的片段要 2.5 GB。 [S3]\n\n## 與其他概念的關係\n- 記憶體怎麼排 → [[memory-and-paging]]\n- 跨請求重用開頭相同的部分 → [[prefix-caching]]\n- 重用不在開頭的片段 → [[non-prefix-reuse]]\n- 商用 API 的版本 → [[api-prompt-caching]]\n- 名詞辨析 → [[terminology]]"}, "memory-and-paging": {"title": "記憶體與 PagedAttention", "path": "concepts/memory-and-paging.md", "desc": "KV cache 吃記憶體的問題與 PagedAttention 的解法（把 OS 分頁用到 KV cache），以及它與 prefix caching 的關係", "md": "# KV cache 的記憶體問題與 PagedAttention\n\n## 問題\n- [C06] 13B 模型在 40GB A100 上，約 65% 記憶體是不變的權重；KV cache 的管理方式決定最大 batch size。 [S1]\n- [C07] 每個 token 的 KV cache 對 Llama 70B 約 2.5 MB（16-bit），所以長 context 很吃記憶體。 [S3]\n\n## 解法：PagedAttention\n- [C08] 把 KV cache 切成固定大小的 block，block 不必連續；block = page、token = byte、request = process。 [S1]\n- [C09] 以此做到接近零浪費，吞吐比 FasterTransformer、Orca 高 2–4×（同等延遲），不影響準確度。 [S1]\n- [C40] 並能在 block 粒度做共享，跨序列甚至跨請求。 [S1]\n\n## 與 prefix caching 的關係\n- PagedAttention 解決「記憶體怎麼排」，prefix caching 解決「哪些 KV 可以重用」。兩者可以組合：S2 說 RadixAttention 與 paged attention 相容 [C37]；S3 也指出 paged attention 可用來在 batch 內共享同一個 module 的指標以降低冗餘 [C43]。 [S2][S3]"}, "prefix-caching": {"title": "Prefix caching", "path": "concepts/prefix-caching.md", "desc": "跨請求重用「開頭相同」的 KV cache：原理、vLLM 的 block hash 做法、SGLang 的 RadixAttention 做法與實測數字", "md": "# Prefix caching（跨請求重用開頭相同的 KV）\n\n## 為什麼 prefix 可以重用\n- [C05] KV cache 的計算只依賴前面的 tokens，所以有相同 prompt prefix 的請求可以重用 KV cache。 [S2]\n- [C12] 因此 prefix caching 不會改變模型輸出。 [S6]\n- [C29] 但只有「開頭」那一段能重用；若相同內容出現在輸入中間，就不是 prefix。 [S4]\n\n## 做法 A：vLLM Automatic Prefix Caching（block + hash）\n- [C10] 每個 block 的 hash 由父 block 的 hash、block 內 tokens 與額外資訊組成，所以 hash 代表「從開頭到這個 block」的整段 prefix。 [S6]\n- [C11] 命中就 ref count 加 1；free queue 的 head 是 LRU，配置新 block 時被淘汰；`cache_salt` 混入第一個 block 的 hash 以隔離不同使用者。 [S6]\n\n## 做法 B：SGLang RadixAttention（radix tree）\n- [C13] 請求結束後不丟棄 KV，保留在 radix tree；LRU 淘汰最近最少使用的 leaf；每個節點有 reference counter，執行中的請求用到的節點不可淘汰。 [S2]\n- [C37] 論文中 KV 以非連續 paged 方式存放，page 大小為 1 個 token；與 continuous batching、paged attention、tensor parallelism 相容。 [S2]\n- [C14] cache-aware scheduling：最長共享 prefix 優先；離線時以 DFS 順序可達最佳 hit rate；貪婪排程可能造成 starvation。 [S2]\n\n## 效果（S2 的實測）\n- [C15] 最高 6.4× 吞吐、最高 3.7× 延遲降低（對 Guidance、vLLM v0.2.5、LMQL）；hit rate 50%–99%；排程平均達最佳 hit rate 的 96%。 [S2]\n- [C16] 沒有可重用 prefix 時，管理成本可忽略：100 個請求 74.3 秒中只花 0.2 秒（< 0.3%）。 [S2]\n- [C17] 在 Chatbot Arena 一個月：hit rate 52.4%（LLaVA-NeXT-34B）、74.1%（Vicuna-33B）；Vicuna-33B 首 token 延遲平均降低 1.7×。 [S2]\n- [C18] 長輸出的多輪對話幾乎沒有加速，因為 decode 時間主導。 [S2]\n\n## 兩種做法的差異（整理）\n| | vLLM APC | SGLang RadixAttention |\n|---|---|---|\n| 辨識方式 | block hash 鏈 [C10] | radix tree [C13] |\n| 淘汰 | free queue head = LRU block [C11] | LRU，先淘汰 leaf [C13] |\n| 粒度 | block（以填滿的 block 為單位） [S6] | 論文中 page = 1 token [C37] |\n| 排程 | 文件未描述 | cache-aware，最長共享 prefix 優先 [C14] |"}, "non-prefix-reuse": {"title": "非 prefix 重用", "path": "concepts/non-prefix-reuse.md", "desc": "當可重用的內容不在輸入開頭時怎麼辦：Prompt Cache（模組化）與 CacheBlend（選擇性重算），以及品質與位置編碼的取捨", "md": "# 非 prefix 的 KV 重用\n\n## 問題\n- [C29] Prefix caching 只能重用開頭；RAG 把多個檢索 chunk 放進輸入，只有第一個 chunk 是 prefix。直接重用其他 chunk 的 KV（full KV reuse）又會忽略 chunk 之間的 cross-attention，可能答錯。 [S4]\n- [C25] 另一個難點是位置編碼讓 attention states 與位置有關。 [S3]\n\n## 做法 A：Prompt Cache（模組化）\n- [C25] 用 schema（PML）把可重用文字段定義成 prompt modules，預先算好存起來；論文觀察 LLM 能處理不連續的 position IDs。 [S3]\n- [C28] 各 module 獨立編碼，跨 module 的 attention 被遮蔽：module 語意獨立時可能無害甚至降低雜訊，相依時品質可能變差。 [S3]\n- [C27] TTFT 改善：摘要與結論為 GPU 最高 8×、CPU 最高 60×；§5.2 的範圍為 GPU 1.5×–10×、CPU 20×–70×。 [S3]\n- [C26] 只降 TTFT，每個 token 的生成時間不變（TTFT 900 ms → 90 ms；約 32 ms／token）。 [S3]\n- [C07] 記憶體成本：Llama 70B 快取 1K tokens 的 module 要 2.5 GB。 [S3]\n\n## 做法 B：CacheBlend（選擇性重算）\n- [C30] 重用預先算好的 KV，再選擇性重算少量 KV deviation 高的 token（HKVD tokens）；預設約 15%，10–20% 通常足夠；重算與載入以 pipeline 重疊。 [S4]\n- [C31] 相較 full KV recompute：TTFT 降 2.2–3.3×、吞吐升 2.8–5×、品質下降不超過 0.01–0.03；吞吐最多比 prefix caching 高 3.3×。 [S4]\n- [C32] 三個模型、四個資料集，實作於 vLLM。 [S4]\n- [C34] 限制：未驗證於 Mamba 等非 transformer 架構。 [S4]\n\n## 來源之間的分歧（必讀）\n- [C39] S2 說 Prompt Cache 準確度最高可能掉 43%；S3 說沒有明顯損失；S4 說忽略 cross-attention 會讓品質下降。三者在不同設定下測量，**不要把任何一個數字當成通則**。見 `lint/conflicts.md` L3。 [S2][S3][S4]"}, "api-prompt-caching": {"title": "API 的 prompt caching", "path": "concepts/api-prompt-caching.md", "desc": "商用 API 的 prompt caching（以 Anthropic 官方文件為例）：怎麼命中、壽命、價格倍率、最小長度、什麼會讓快取失效", "md": "# API 的 prompt caching（Anthropic 文件，2026-11-15 取得）\n\n> 這是 API 的「功能」，不是某篇論文的系統。價格與限制會變，一律以官方文件為準。\n\n## 怎麼運作\n- [C19] 快取到 `cache_control` 指定 block 為止的完整 prefix，順序為 tools → system → messages。 [S5]\n- [C20] 預設壽命 5 分鐘，每次命中免費刷新；可選 1 小時。 [S5]\n- [C24] 快取不影響輸出，回應與不使用時相同。 [S5]\n\n## 錢怎麼算\n- [C21] 5 分鐘寫入 1.25×、1 小時寫入 2×、讀取一般 0.1×（部分模型更低，文件列出 0.05×、0.025× 的例外）。 [S5]\n\n## 什麼時候不會命中\n- [C22] prompt 短於該模型的最小長度（512 到 4,096 tokens，依模型而異）就不快取，也不會報錯；用 `cache_creation_input_tokens` 與 `cache_read_input_tokens` 判斷是否命中。 [S5]\n- [C23] 需要 prefix 100% 相同；改 tool 定義讓整個快取失效；`tool_choice` 或圖片增減讓 messages 部分失效；breakpoint 要放在最後一個穩定的 block，放在含時間戳的 block 上永遠不會命中；最多 4 個明確 breakpoint。 [S5]\n\n## 實務檢查清單（解說，整理自上列 claim）\n1. 把不會變的內容（tool 定義、系統指示、長文件）放在 prompt 最前面。\n2. 把會變的內容（時間戳、使用者問題）放在最後，並把 breakpoint 放在變動內容之前。\n3. 看 usage 欄位確認有沒有命中，不要假設。\n4. 請求間隔可能超過 5 分鐘時，評估 1 小時壽命。"}, "terminology": {"title": "術語表", "path": "concepts/terminology.md", "desc": "KV cache 領域容易混淆的術語表：KV cache、prefix caching、Prompt Cache 與 prompt caching、PagedAttention、RadixAttention、TTFT 等", "md": "# 術語表（Wiki 內統一用法）\n\n| 術語 | 在本 Wiki 指什麼 | 來源 |\n|---|---|---|\n| **KV cache** | 單一請求生成過程中，存起來重用的每個 token 的 key / value [C01] | S3 |\n| **prefill / decode** | 先處理整個輸入並建立 KV cache；之後一次生成一個 token [C03] | S3 |\n| **TTFT** | 時間到第一個 token；prefill 延遲決定它 [C41] | S4 |\n| **PagedAttention** | KV cache 的**記憶體排法**：切成固定大小 block，可不連續 [C08] | S1 |\n| **prefix caching** | **跨請求**重用「輸入開頭相同」的 KV [C05] | S2、S4、S6 |\n| **Automatic Prefix Caching (APC)** | vLLM 的 prefix caching 實作，用 block hash [C10] | S6 |\n| **RadixAttention** | SGLang 的 prefix caching 實作，用 radix tree [C13] | S2 |\n| **Prompt Cache**（大寫、專有名詞） | S3 論文提出的系統：以 schema 做**非 prefix** 的模組化重用 [C25] | S3 |\n| **prompt caching**（小寫、功能名） | 商用 API 的功能，快取的是 prefix，以 `cache_control` 控制 [C19] | S5 |\n| **full KV reuse** | 直接拼接各 chunk 預先算好的 KV，忽略 cross-attention [C29] | S4 |\n| **CacheBlend** | 重用 KV 後再選擇性重算約 15% token [C30] | S4 |\n\n## 容易混淆的地方\n- [C36] **Prompt Cache**（S3 的系統，非 prefix、模組化）與 **prompt caching**（S5 的 API 功能，prefix 式）只差大小寫與一個字母，但是兩個東西。這是本 Wiki 對 S3 與 S5 的整理，不是任一來源的原文。 [S3][S5]\n- **PagedAttention 是記憶體排法，prefix caching 是重用策略**；它們屬於不同層次，S2 說 RadixAttention 與 paged attention 相容。 [C37][S2]\n- 「快取」不等於「變快」：Prompt Cache 只降 TTFT [C26]，長輸出的多輪對話幾乎沒加速 [C18]。"}, "s1-pagedattention-vllm": {"title": "S1 PagedAttention", "path": "sources/s1-pagedattention-vllm.md", "desc": "PagedAttention / vLLM 論文（SOSP 2023）：把 OS 的分頁概念用在 KV cache 記憶體管理，減少浪費、提高 batch size 與吞吐", "md": "# S1 — Efficient Memory Management for LLM Serving with PagedAttention\n\n- 書目：Kwon et al., SOSP 2023；arXiv 2309.06180（v1，2023-09-12）\n- 取得方式：WebSearch 回傳的論文原文片段（arXiv PDF、ar5iv）與 WebFetch 對 PDF 的擷取（2026-11-15）\n- 驗證狀態：**一手，但不是全文逐頁讀過。** 原文片段確認的 claim 標為 `snippet`；只出現在 WebFetch 擷取摘要（由工具的小模型整理）的標為 `extract-only`，**未獨立驗證，不得用於簡報數字**。\n\n## 重點（claim）\n- [C06] 以 13B 模型跑在 40GB A100：約 65% 記憶體是不變的模型權重；activation 只佔一小部分，所以 KV cache 的管理方式決定最大 batch size。 [S1 Fig.1 與其說明；snippet]\n- [C08] PagedAttention 把每個請求的 KV cache 切成固定大小的 block，block 不必存放在連續空間；類比：block = page、token = byte、request = process。 [S1 §1；snippet]\n- [C09] vLLM 達成「接近零浪費」的 KV cache 記憶體，吞吐比 FasterTransformer、Orca 等最新系統高 2–4×（同等延遲），且不影響準確度。 [S1 摘要與 §1；snippet]\n- [C40] 可在 block 粒度做記憶體共享，跨同一請求的不同序列、甚至跨請求。 [S1 §1；snippet]\n- [C38] （extract-only）既有系統中，只有約 20.4%–38.2% 的 KV cache 記憶體實際存放 token states。 [擷取摘要，未於原文片段中看到]\n- [C42] （extract-only）parallel sampling 以 reference count 與 block 級 copy-on-write 共享 prompt 的 KV；預設 block 大小 16 tokens。 [擷取摘要，未於原文片段中看到]\n\n## 使用時要小心\n- 2–4× 是「與同等延遲下的 FasterTransformer、Orca 比」，不是和今天的 vLLM 或其他引擎比。\n- C38、C42 的數字我個人印象與這篇論文相符，但依 schema 規則 2 沒有一手全文佐證，所以不採用。若要採用，需補讀全文。"}, "s2-sglang-radixattention": {"title": "S2 SGLang", "path": "sources/s2-sglang-radixattention.md", "desc": "SGLang 論文（NeurIPS 2024）的 RadixAttention：以 radix tree 自動跨請求重用 KV cache、LRU 淘汰、cache-aware 排程與實測數字", "md": "# S2 — SGLang: Efficient Execution of Structured Language Model Programs\n\n- 書目：Zheng et al., NeurIPS 2024；arXiv 2312.07104（v2，2024-06-06）\n- 取得方式：WebFetch 全文 `arxiv.org/pdf/2312.07104`（2026-11-15）\n- 驗證狀態：**一手、全文已讀**\n\n## 這篇在講什麼\nSGLang 是一個執行「多次 LLM 呼叫的程式」的系統，前端語言加上後端 runtime。與本主題相關的是 runtime 裡的 **RadixAttention**：自動、系統化地重用 KV cache。\n\n## 重點（claim）\n- [C05] KV cache 的計算只依賴「前面的 tokens」，因此有相同 prompt prefix 的請求可以重用 KV cache，減少重複計算與記憶體。 [S2 §3、附錄 A.1]\n- [C13] 既有推論引擎在請求結束後會丟棄 KV cache；RadixAttention 改為把 prompt 與生成結果的 KV 保留在 radix tree 中，用 LRU 淘汰「最近最少使用的 leaf」，每個節點有 reference counter，正在執行的請求用到的節點不可被淘汰。 [S2 §1、§3]\n- [C37] 論文中 radix tree 的 KV 以非連續的 paged 方式儲存，page 大小等於 1 個 token；RadixAttention 與 continuous batching、paged attention、tensor parallelism 相容。 [S2 §3]\n- [C14] cache-aware scheduling 採「最長共享 prefix 優先」；離線情況下，以 DFS 順序走訪 radix tree 可達最佳 cache hit rate（Theorem 3.1）；貪婪排程可能造成 starvation（論文列為未來工作）。 [S2 §3、§8]\n- [C15] 最高 6.4× 吞吐、最高 3.7× 延遲降低（對照 Guidance、vLLM v0.2.5、LMQL，跨多種 workload）；各 benchmark 的 cache hit rate 為 50%–99%；cache-aware 排程平均達到最佳 hit rate 的 96%。 [S2 §6.2]\n- [C16] 沒有任何可重用 prefix 時開銷可忽略：跑 100 個請求花 74.3 秒，管理 RadixAttention 資料結構只用 0.2 秒（< 0.3%）。 [S2 §6.3]\n- [C17] 在 Chatbot Arena 部署一個月：LLaVA-NeXT-34B 的 hit rate 52.4%、Vicuna-33B 為 74.1%；Vicuna-33B 的首 token 延遲平均降低 1.7×。 [S2 §6.2]\n- [C18] multi-turn chat 且輸出很長時幾乎沒有加速：不同對話之間共享少，decode 時間主導；KV 重用主要降低的是 prefix（prefill）時間。 [S2 §6.2]\n- [C39] 論文 Related Work 說 PromptCache「可模組化重用 beyond prefix，但準確度最高可能掉 43%」。這是 S2 的說法，與 S3 自己的結論（無明顯準確度損失）不一致，見 `lint/conflicts.md` L3。 [S2 §7]\n\n## 使用時要小心\n- 對照組是 **vLLM v0.2.5**（舊版）；論文註記 RadixAttention 之後已部分整合進 vLLM，所以 6.4× 不代表今天與最新 vLLM 的差距。\n- 6.4× 是「最高」，不是平均，且包含 compressed FSM 等非 KV 重用的優化。簡報敘述必須寫「最高」並指明是多種 workload 的整體結果。\n- 網路上轉述的 10×、5× 與「vLLM 0 hit rate」等表格不在論文中，不採用（見 `lint/conflicts.md` L1）。"}, "s3-prompt-cache": {"title": "S3 Prompt Cache", "path": "sources/s3-prompt-cache.md", "desc": "Prompt Cache 論文（MLSys 2024）：以 schema 與 prompt module 做「非 prefix」的 attention state 重用；含 KV cache 基礎說明、TTFT 數字、記憶體成本", "md": "# S3 — Prompt Cache: Modular Attention Reuse for Low-Latency Inference\n\n- 書目：Gim, Chen, Lee, Sarda, Khandelwal, Zhong；MLSys 2024；arXiv 2311.04934（v2，2024-04-25）\n- 取得方式：WebFetch 全文 `arxiv.org/pdf/2311.04934v2`（2026-11-15）\n- 驗證狀態：**一手、全文已讀**\n- 名稱注意：這是**一個系統的名字**（Prompt Cache），不是「API 的 prompt caching 功能」，兩者不同，見 `concepts/terminology.md`。\n\n## 重點（claim）\n- [C02] 自回歸生成時，若不快取，每一步模型都以「整個 prompt 加上已生成的 tokens」當輸入，attention states 重算。 [S3 §2.1、§2.2]\n- [C01] KV Cache：每個 token 的 key / value 只算一次，之後重用；每次生成只需計算新 token 的 K、V。 [S3 §1、§2.2]\n- [C03] 先對輸入算好 attention states 並存起來，稱為 prefill phase；後續每一步沿用快取，再把新 token 的 K、V 附加進去。 [S3 §2.2]\n- [C35] 每一步的運算量約由 6nd²+4n²d 降為 6d²+4nd（n 為序列長度、d 為 hidden size）。 [S3 §2.2]\n- [C04] 在因果（causal）語言模型中使用 KV Cache 不影響準確度，因為位置 i 的 attention 只依賴它前面的 tokens。 [S3 §2.2]\n- [C25] Prompt Cache：用 schema（Prompt Markup Language, PML）定義可重用文字段（prompt modules），先算好 attention states 存起來，不同 prompt 命中時直接取用。難點是位置編碼讓 attention states 與位置有關；論文的觀察是 LLM 能處理不連續的 position IDs。 [S3 §1、§3]\n- [C28] 各 module 獨立編碼，跨 module 的 attention 被遮蔽（masking effect）：module 語意獨立時可能降低雜訊，相依時品質可能變差。 [S3 §3.3]\n- [C27] TTFT 改善：摘要與結論寫「GPU 最高 8×、CPU 最高 60×」；§5.2 的詳細範圍是 GPU 1.5×–10×（module 放 CPU 記憶體約 1.5–3×、放 GPU 記憶體約 5–10×）、CPU 20×–70×（AMD 20×、Intel 70×）。 [S3 摘要、§5.2、§6]\n- [C26] 只降低 TTFT，後續每個 token 的生成時間不變：RTX 4090、Llama 7B、3K context，TTFT 從 900 ms 降到 90 ms，每 token 約 32 ms。 [S3 §5.4]\n- [C07] 每個 token 的 KV cache 記憶體（16-bit）：Falcon 1B 0.18 MB、Llama 7B 0.50 MB、Llama 13B 0.78 MB、Llama 70B 2.5 MB；Llama 70B 快取一個 1K tokens 的 module 要 2.5 GB。 [S3 §5.5、Table 2]\n\n## 使用時要小心\n- 摘要/結論（8×、60×）與 §5.2（最高 10×、70×）數字不同；兩者並列時要說明脈絡。見 `lint/conflicts.md` L2。\n- 論文自稱「沒有明顯準確度損失」，S2 與 S4 對此有不同看法，見 `lint/conflicts.md` L3。\n- 實驗在 HuggingFace transformers 原型上、Llama2 / Falcon / MPT，不是生產環境。"}, "s4-cacheblend": {"title": "S4 CacheBlend", "path": "sources/s4-cacheblend.md", "desc": "CacheBlend 論文（EuroSys 2025）：RAG 多 chunk 情境下，重用非 prefix 的 KV cache 並選擇性重算約 15% token 以保住品質", "md": "# S4 — CacheBlend: Fast LLM Serving for RAG with Cached Knowledge Fusion\n\n- 書目：Yao et al.（University of Chicago 等）；EuroSys 2025（Microsoft Research 頁面標註 Best Paper Award）；arXiv 2405.16444（v2，2024-06-03）\n- 取得方式：WebFetch 全文（Princeton 課程提供的 PDF，內容為 arXiv v2）與 Microsoft Research 發表頁（2026-11-15）。直接抓 arXiv 摘要頁一度失敗（URL 未曾出現在搜尋結果中，被工具拒絕），改抓上述兩個頁面。\n- 驗證狀態：**一手、全文已讀**\n\n## 重點（claim）\n- [C33] prefill 很慢：4K tokens 的輸入，在單張 A40 上 Llama-34B 約需 3 秒、Llama-70B 約 6 秒。 [S4 §2]\n- [C29] Prefix caching 只能重用輸入開頭那一段；RAG 會把多個檢索到的 chunk 放進輸入，只有第一個 chunk 是 prefix，其餘無法重用。Full KV reuse（如 S3 的做法）雖然快，卻忽略 chunk 之間的 cross-attention，可能答錯。 [S4 §1、§3]\n- [C30] CacheBlend：重用預先算好的 KV cache，再「選擇性重算」少量 token（KV deviation 高的 HKVD tokens）。預設重算比例約 15%；論文經驗上 10–20% 通常足以保住品質；重算與載入下一層 KV 以 pipeline 重疊，因此不增加延遲。 [S4 §1、§4、§5]\n- [C31] 結果：相較 full KV recompute，TTFT 降低 2.2–3.3×、吞吐提升 2.8–5×，品質下降不超過 0.01–0.03；同樣 TTFT 下吞吐最高比 prefix caching 高 3.3×（prefix caching 的基線做了「無載入延遲」的理想化假設，對它有利）。 [S4 摘要、§7]\n- [C32] 實驗：Mistral-7B、Yi-34B、Llama-70B 三個模型，2WikiMQA、Musique、SAMSum、MultiNews 四個資料集，實作於 vLLM 之上。 [S4 §7.1]\n- [C34] 限制：論文的觀察（如 attention 稀疏性）不一定適用 Mamba、Griffin 等非 transformer 架構；也未在 DistServe 等最新引擎上評估。 [S4 §9]\n\n## 使用時要小心\n- 同一篇論文的引言寫「相較 prefix caching 降低 TTFT 2.2–3.3×、三個資料集」，摘要與 §7 寫「相較 full KV recompute、四個資料集」。以 §7 的拆分為準，見 `lint/conflicts.md` L4。\n- S4 對 S3 的評語（忽略 cross-attention 導致品質下降）是 S4 的立場，S3 自己的實驗與此不同。"}, "s5-anthropic-prompt-caching": {"title": "S5 Anthropic 文件", "path": "sources/s5-anthropic-prompt-caching.md", "desc": "Anthropic 官方 prompt caching 文件（取得日 2026-11-15）：prefix 順序、TTL、價格倍率、最小長度、失效條件與用量欄位", "md": "# S5 — Anthropic Claude Platform Docs: Prompt caching\n\n- 位置：`platform.claude.com/docs/en/build-with-claude/prompt-caching`\n- 取得方式：WebFetch 全文（2026-11-15）\n- 驗證狀態：**一手（廠商官方）、全文已讀；內容會隨時間改變**，引用價格與限制時必須註明「以官方文件為準」\n\n## 重點（claim）\n- [C19] API 的 prompt caching 讓請求從「prompt 的某個 prefix」繼續處理；快取的是到 `cache_control` 指定 block 為止的**完整 prefix**，順序為 tools → system → messages。 [S5 How prompt caching works]\n- [C20] 預設快取壽命 5 分鐘，每次命中免費刷新；可選 1 小時壽命。壽命從寫入或讀取該快取的請求「開始」時起算。 [S5]\n- [C21] 價格倍率：5 分鐘寫入為基本輸入價的 1.25×、1 小時寫入 2×、讀取一般為 0.1×；部分模型的讀取倍率更低（文件列出 0.05×、0.025× 的例外）。 [S5 Pricing]\n- [C22] 最小可快取長度依模型而異，文件列出 512 到 4,096 tokens；prompt 太短會「不快取、也不報錯」；可用回應 usage 中的 `cache_creation_input_tokens` 與 `cache_read_input_tokens` 判斷是否命中。 [S5 Cache limitations、Tracking cache performance]\n- [C23] 命中需要 prefix 100% 相同；改動 tool 定義會讓整個快取失效；`tool_choice` 或圖片的增減會讓 messages 部分失效；最多 4 個明確 breakpoint；breakpoint 應放在「各請求之間最後一個不變的 block」，若放在含時間戳或使用者輸入的 block，每次都會寫入新項目而從不命中。 [S5 What invalidates the cache、Structuring your prompt]\n- [C24] 快取不影響輸出：回應與不使用快取時相同。 [S5 Cache storage and sharing]\n- 隔離與資料處理：快取以 workspace（部分平台為 organization）隔離；KV cache 表示與雜湊只存在記憶體中，不寫入磁碟。 [S5 Data retention]（此條未進帳本，簡報未使用）\n\n## 使用時要小心\n- 搜尋結果中的舊版文件鏡像與第三方轉載頁，顯示的是舊模型清單、固定 0.1× 讀取價與 1,024/2,048 tokens 最小長度；與官方現行頁面不同。見 `lint/conflicts.md` L5。\n- 文件描述的是 API 行為，**並未揭露底層如何實作**；不可據此推論 Anthropic 內部使用 RadixAttention 或 PagedAttention。"}, "s6-vllm-automatic-prefix-caching": {"title": "S6 vLLM APC", "path": "sources/s6-vllm-automatic-prefix-caching.md", "desc": "vLLM 官方設計文件 Automatic Prefix Caching：以 block hash 鏈做 prefix 重用、ref count 與 free queue 淘汰、cache_salt 隔離", "md": "# S6 — vLLM Design Doc: Automatic Prefix Caching\n\n- 位置：`docs.vllm.ai/en/latest/design/prefix_caching/`\n- 取得方式：搜尋結果中的文件原文片段，加上 WebFetch 對該頁的擷取（2026-11-15）。**注意：WebFetch 這次回傳的是工具產生的擷取摘要，不是全文原文。** 下列 claim 都有對應的原文片段佐證，或標註為「僅擷取」。\n- 驗證狀態：一手（官方文件），部分為擷取\n\n## 重點（claim）\n- [C10] APC 以 hash 辨識可重用的 KV block：每個 block 的 hash 由「父 block 的 hash、這個 block 的 tokens、額外 hash（例如 LoRA ID；多模態輸入會帶入圖片 hash）」組成，因此一個 block 的 hash 代表從開頭到它為止的整段 prefix。 [S6 Overview/Hashing，原文片段已確認]\n- [C11] 命中時，被重用的 block 的 reference count 加 1，並從 free queue 移除避免被淘汰；配置新 block 時從 free queue 的 head 取出，那就是 LRU block，若它是快取 block 就會被 evict；請求結束後釋放的 block 以相反順序放到 queue 尾端，所以請求的最後一個 block 先被淘汰。`cache_salt` 會被混進第一個 block 的 hash，只有 salt 相同的請求才能重用，用來隔離不同使用者。 [S6 Operations、Cache Isolation；free queue 順序與 cache_salt 目的為擷取內容]\n- [C12] Prefix caching 不會改變模型輸出（文件稱它幾乎是免費的午餐）。預設 hash 演算法自 v0.11 起為 sha256；舊版的 hash key 不保證無碰撞。 [S6]\n\n## 使用時要小心\n- vLLM 以 **block** 為單位比對（block 要填滿才會被快取），與 S2 論文中 RadixAttention 的 token 級 page（page 大小 1）粒度不同。第三方文件顯示 SGLang 現行實作的 page 大小可設定，表示實作已隨時間演進，不要把論文當作現行程式碼的描述。見 `lint/conflicts.md` L6。"}, "conflicts": {"title": "衝突紀錄", "path": "lint/conflicts.md", "desc": "來源之間、或來源與二手說法之間的衝突紀錄與處理決定（不覆蓋、不抹平，寫明採用哪個以及為什麼）", "md": "# 衝突紀錄\n\n| ID | 衝突 | 處理 |\n|---|---|---|\n| L1 | 搜尋結果裡的部落格與轉載頁，對 SGLang 寫出 10×、5× 的加速，以及「vLLM hit rate 為 0」之類的表格；這些數字在 S2 全文中找不到。 | 不採用。數字一律取 S2 全文：**最高 6.4× 吞吐、最高 3.7× 延遲降低** [C15]。 |\n| L2 | S3 自己的摘要/結論寫「GPU 最高 8×、CPU 最高 60×」，§5.2 的詳細範圍寫 GPU 1.5×–10×、CPU 20×–70×。同一篇論文內部不一致。 | 兩組都留在帳本 [C27]，簡報只用「GPU 約 1.5–10×、CPU 約 20–70×（論文摘要寫 8× 與 60×）」，並指明脈絡。 |\n| L3 | Prompt Cache 的準確度：S3 說沒有明顯損失；S2 轉述「最高可能掉 43%」；S4 說 full KV reuse 忽略 cross-attention 會降低品質。 | 三個都記 [C28][C39][C29]。結論寫成「不同設定下的結果不同，沒有通則」，簡報不給單一數字當結論。 |\n| L4 | S4 的引言寫「相較 prefix caching 降 TTFT 2.2–3.3×、三個資料集」；摘要與 §7 寫「相較 full KV recompute、四個資料集」，並另外說同樣 TTFT 下吞吐最多比 prefix caching 高 3.3×。 | 以 §7 的拆分為準 [C31][C32]：2.2–3.3× 的基線是 full KV recompute；3.3× 的吞吐優勢才是對 prefix caching。 |\n| L5 | Anthropic 文件：官方現行頁面與舊版鏡像/第三方轉載不同（舊模型清單、讀取價固定 0.1×、最小長度 1,024/2,048）。 | 以官方現行頁面為準 [C21][C22]，簡報價格頁加註「以官方文件為準，取得日 2026-11-15」。 |\n| L6 | S2 論文寫 radix tree 的 page 大小為 1 token；第三方文件顯示 SGLang 現行實作的 page 大小可調；S6 的 vLLM 以 block 為單位。 | 簡報只說「論文中 page=1 token [C37]」與「vLLM 以 block 為單位 [C10]」，不聲稱現行程式碼細節。 |\n| L7 | S1 的 20.4%–38.2% 與「block 預設 16、copy-on-write」只出現在 WebFetch 擷取摘要，我的搜尋沒能在原文片段中重現。 | 標 `extract-only` [C38][C42]，簡報不使用。 |\n| L8 | S6 的 WebFetch 回傳的是工具擷取，不是原文。其中 free queue 順序、`cache_salt`、sha256 為 `extract-only`。 | [C11][C12] 標 `extract-only`；簡報只講 hash 鏈的概念 [C10]，不講 sha256 或淘汰順序。 |"}, "log": {"title": "Ingest 紀錄", "path": "log.md", "desc": "Ingest 與討論紀錄：每篇來源在寫入前的討論結論（先討論、後生成）與生成後的結果", "md": "# Ingest 紀錄（2026-11-15）\n\n> 「討論」是寫入 Wiki 前，我先決定要抽什麼、要小心什麼；「生成」是實際寫了什麼。此處為摘要版。\n\n| # | 來源 | 討論（寫入前） | 生成（寫入後） |\n|---|---|---|---|\n| 1 | S3 Prompt Cache | 這篇同時是「KV cache 基礎」與「非 prefix 重用」的來源；名字和 API 的 prompt caching 太像，需要在術語表分開。數字有摘要與 §5.2 兩組，先都記。 | s3 來源頁；C01–C04、C07、C25–C28、C35、C43；L2、L3 |\n| 2 | S2 SGLang | 重點只取 RadixAttention，不寫語言前端。搜尋結果的二手數字與論文不同，要以全文為準。 | s2 來源頁；C05、C13–C18、C37、C39；L1、L6 |\n| 3 | S4 CacheBlend | 要回答「prefix caching 不夠用時怎麼辦」。比較基線有兩種（full recompute 與 prefix caching），必須分清楚。 | s4 來源頁；C29–C34、C41；L4 |\n| 4 | S5 Anthropic 文件 | 廠商文件會變，必須標取得日；不得從 API 行為推論底層實作。 | s5 來源頁；C19–C24；L5 |\n| 5 | S6 vLLM APC | 本來想詳述淘汰順序，但抓到的是工具摘要不是原文，降級為 extract-only。 | s6 來源頁；C10–C12；L8 |\n| 6 | S1 PagedAttention | 定位是「記憶體排法」，不是「重用策略」。2–4× 的基線是舊系統。部分數字無法在原文片段重現，不採用。 | s1 來源頁；C06、C08、C09、C38、C40、C42；L7 |\n\n概念頁：kv-cache、memory-and-paging、prefix-caching、non-prefix-reuse、api-prompt-caching、terminology。"}, "graph": {"title": "Loop / graph 設計", "path": "logs/graph.md", "desc": "Loop / graph 設計（v2）：從取得資料、討論、ingest、三道檢查關卡到簡報產生；哪些步驟會重複、哪裡檢查、為什麼這樣設計", "md": "# Loop / Graph 設計（v2）\n\n## 流程圖\n\n```mermaid\nflowchart TD\n  A[取得資料<br/>WebSearch / WebFetch] --> B[討論<br/>抽哪些重點、術語、可能的衝突]\n  B --> C[生成來源頁<br/>＋ 寫入 claims.json]\n  C --> G1{{關卡 1：每個數字<br/>有一手全文佐證？}}\n  G1 -- 否：補抓全文 --> A\n  G1 -- 否：抓不到 --> D1[降級為 extract-only<br/>簡報不得使用]\n  G1 -- 是 --> D[更新概念頁<br/>＋ lint/conflicts.md]\n  D1 --> D\n  D --> G2{{關卡 2：wiki lint<br/>check.py wiki}}\n  G2 -- 錯誤 --> C\n  G2 -- 通過 --> E[查 Wiki<br/>排教學大綱]\n  E --> F[逐頁生成<br/>每頁宣告 data-claims]\n  F --> G3{{關卡 3：逐頁檢查<br/>check.py slides ＋ 渲染檢查}}\n  G3 -- 該頁錯 --> F\n  G3 -- 帳本缺漏 --> C\n  G3 -- 通過 --> H[發佈 HTML 簡報]\n```\n\n重複執行的迴圈有兩個：\n- **ingest 迴圈**：每一篇來源都走一次 A → B → C → 關卡 1（共 6 篇）。\n- **生成迴圈**：每一頁走一次 F → 關卡 3（共 22 頁），不通過就只退回那一頁。\n\n## 各節點在做什麼\n| 節點 | 做什麼 | 輸出 |\n|---|---|---|\n| 取得資料 | 用搜尋找來源，再抓全文 | 原文（或工具擷取摘要） |\n| 討論 | 寫入前先決定：這篇要抽什麼、會跟哪些頁面衝突、術語怎麼處理（先討論、後生成） | `log.md` 的「討論」欄 |\n| 生成來源頁 | 只記來源自己說的；每個主張一個 claim id | `sources/*.md`、`claims.json` |\n| 關卡 1 | 數字是否在「已抓取的一手全文」找得到；找不到就標 `extract-only` | claim 的 `status` |\n| 更新概念頁 | 把 claim 組成給初學者讀的概念頁，每句標 `[C##]` | `concepts/*.md` |\n| 關卡 2 | `tools/check.py wiki`：引用的 claim 都存在、帳本沒有孤兒、帶數字的事實行有標註 | 錯誤／警告清單 |\n| 查 Wiki、排大綱 | 只用 Wiki 裡的 claim 排出教學順序 | 22 頁大綱 |\n| 逐頁生成 | 每頁 `data-claims` 寫明依據；沒依據的頁面標 `none`（純解說） | `deck.html` |\n| 關卡 3 | `tools/check.py slides`：每頁數字必須在引用 claim 的 `numbers` 內，且不得引用 extract-only；再用瀏覽器逐頁檢查溢出 | 錯誤清單 |\n\n## 為什麼這樣設計\n1. **錯誤在 ingest 就會產生，不是在寫簡報時才產生。** 來源之間、搜尋摘要與全文之間的數字會不一致。如果等簡報寫完才檢查，已經分不清錯是誰造成的，所以第一道關卡放在「寫進 Wiki 之前」。\n2. **簡報只能引用帳本。** 簡報的每個數字都能追到 claim、來源與驗證狀態；這讓「Wiki 與簡報的對應」是可以機械檢查的，而不是口頭保證。\n3. **不通過只退回最小單位。** 一頁出錯只重生成那一頁；帳本缺漏才退回 ingest。這樣修一個錯不會讓整份簡報重來。\n4. **機械檢查與人工檢查分工。** `check.py` 只能檢查「數字有沒有來源」，不能檢查「句子的意思有沒有講歪」，所以意思的部分仍要人工抽查，見 `logs/run-001.md` 的限制。"}, "run-001": {"title": "執行紀錄與反思", "path": "logs/run-001.md", "desc": "第一次完整執行的紀錄：各階段實際發現的問題、檢查器輸出、graph 的修改，以及反思（哪個節點最常出錯、檢查提前到哪裡）", "md": "# 執行紀錄 run-001（2026-11-15）\n\n## 時間線\n| 階段 | 發生什麼 |\n|---|---|\n| 計畫（graph v1） | 流程是：取得資料 → 寫 Wiki → 產生簡報 → **簡報完成後**逐頁回頭對照 Wiki。 |\n| 取得資料 | 用 7 次搜尋找到 6 篇來源，再抓全文（5 篇原文、2 篇部分為擷取）。這裡就開始出現不一致（見下表）。 |\n| 修改 graph（v1 → v2） | 在寫任何 Wiki 頁面之前，先加入「數字須有一手全文佐證」的關卡與 `claims.json` 帳本。 |\n| ingest | 6 篇來源逐篇「先討論、後生成」，寫成 6 個來源頁、6 個概念頁、43 條 claim、8 項衝突紀錄。 |\n| Wiki lint | `check.py wiki`：0 錯誤、3 警告。 |\n| 生成簡報 | 22 頁，每頁宣告 `data-claims`。 |\n| 簡報檢查第 1 次 | `check.py slides`：**14 個錯誤**。 |\n| 修正 | 補帳本與修改簡報。 |\n| 簡報檢查第 2 次 | 0 錯誤、0 警告；再用瀏覽器逐頁檢查溢出：22 頁無溢出，手機寬度無橫向捲動。 |\n\n## 在取得資料與 ingest 階段發現的問題（在寫簡報之前）\n| ID | 問題 | 屬於哪一種 | 處理 |\n|---|---|---|---|\n| L1 | 部落格與轉載頁的 SGLang 數字（10×、5× 等）在論文全文找不到 | 二手來源失真 | 只採論文全文：最高 6.4× |\n| L2 | Prompt Cache 論文摘要（8×、60×）與內文（1.5–10×、20–70×）不一致 | 一手來源內部不一致 | 兩組都記，簡報並列並說明 |\n| L3 | 三篇論文對「非 prefix 重用品質」的說法不同 | 來源之間意見不同 | 不抹平，簡報用「沒有通則」呈現（第 18 頁） |\n| L4 | CacheBlend 引言與摘要／§7 的比較基線、資料集數量不同 | 一手來源內部不一致 | 以 §7 為準 |\n| L5 | Anthropic 文件的官方現行頁面與舊版鏡像不同（價格倍率、最小長度） | 來源過期 | 以現行官方頁為準，標註取得日 |\n| L6 | 論文的 page=1 token 與現行實作可能不同 | 論文與現況落差 | 簡報只說「論文中」 |\n| L7 | PagedAttention 的 20.4%–38.2%、block 預設 16 等，只出現在工具擷取摘要 | 擷取不可靠 | 標 `extract-only`，不用 |\n| L8 | vLLM 文件抓到的是工具摘要，不是全文 | 擷取不可靠 | 淘汰順序、sha256 標 `extract-only`，不用 |\n\n另外一個過程中的失敗：直接抓 CacheBlend 的 arXiv 摘要頁被工具拒絕（該網址沒有出現在搜尋結果中），改抓 Microsoft Research 發表頁與 PDF。\n\n## 檢查器輸出（原始紀錄）\n\n**Wiki lint（`logs/lint-wiki-run1.txt`）**\n```\nWARN  W3 prefix-caching.md: 引用 extract-only C12（簡報不得使用）\nWARN  W3 prefix-caching.md: 引用 extract-only C11（簡報不得使用）\nWARN  W3 prefix-caching.md: 引用 extract-only C11（簡報不得使用）\n結果：0 個錯誤、3 個警告\n```\n這 3 個警告是正確的：概念頁可以記錄 vLLM 文件的細節，但簡報不能用。簡報第 13 頁只講 hash 鏈的概念（C10）。\n\n**簡報檢查第 1 次（`logs/lint-slides-run1.txt`）：14 個錯誤**\n| 位置 | 錯誤數字 | 原因 | 屬於 |\n|---|---|---|---|\n| 第 8 頁 | 6、4（各出現兩次，共 4 個） | 公式係數沒列進 C35 的 numbers | 帳本不完整 |\n| 第 9 頁 | 40（3 次） | `A40` 沒列進 C33 | 帳本不完整 |\n| 第 10 頁 | 100、16 | `A100`、`16-bit` 沒列進 C06、C07 | 帳本不完整 |\n| 第 14 頁 | 0.2.5 | 基線 vLLM v0.2.5 沒列進 C15 | 帳本不完整 |\n| 第 15 頁 | 1、2 | 簡報自己加的「問題 1／問題 2」標題 | 簡報生成 |\n| 第 16 頁 | 4090、7 | `RTX 4090`、`Llama 7B` 沒列進 C26 | 帳本不完整 |\n\n**12 個是帳本不完整、2 個是簡報自己編號。** 這些數字在來源裡都是真的，錯在 ingest 時 claim 的 `numbers` 欄沒寫全，而不是簡報編造數字。簡報自己加的編號則改掉標題。\n\n**簡報檢查第 2 次（`logs/lint-slides-run2.txt`）**\n```\n== 簡報（22 頁） 檢查 ==\n結果：0 個錯誤、0 個警告\n```\n\n## 其他實際發生的修改\n- 檢查器第一版用「子字串」比對數字，太寬鬆（例如 6 會誤配 6.4），改成「數字 token 完全相等」。\n- 人工抽查語意時改了兩處措辭：第 6 頁「輸入越長，等待越久」標為（解說）；第 21 頁自我檢查的答案原本說「需要 CacheBlend 這類方法補償」，不精確，改為「需要 Prompt Cache、CacheBlend 這類方法」。\n- 第 4 頁示範用的 token 數字是「示意」，不在 claim 範圍，頁面上已標明（非實測）。\n\n## 檢查器的限制（要誠實說明）\n- `check.py` 只確認「頁面上的數字出現在被引用 claim 的 numbers 內」，**不確認句子的意思沒講歪**。語意必須人工抽查。\n- 帳本的 `numbers` 是我整理的白名單；如果整理時就抄錯，檢查器不會發現。所以關卡 1 的「對照一手全文」不能省。\n- S1（PagedAttention）只有原文片段，不是全文逐頁讀過；S6 部分為擷取。這兩者已在帳本標明，並限制使用範圍。\n\n## 反思\n\n**哪一個節點最常出錯？** 「取得資料 → 生成來源頁」這一段（ingest）。8 項衝突紀錄中有 6 項（L1、L2、L4、L5、L7、L8）出在這裡；簡報檢查第 1 次的 14 個錯誤中，12 個也是 ingest 時帳本沒寫全。簡報生成節點只出 2 個，而且是自己加的編號。\n\n**把檢查往前移到哪裡？** 原本（v1）只在簡報做完之後才逐頁對照。蒐集來源時我發現搜尋摘要、部落格和論文全文的數字會對不起來，如果讓這些數字先進 Wiki，簡報每一頁都可能繼承錯誤，事後很難追是哪裡錯。所以把「數字須有一手全文佐證」放到**寫入 Wiki 之前**（關卡 1），並加入 `extract-only` 狀態，讓抓不到全文的數字被隔離在簡報之外。\n\n**有沒有修改 workflow / graph？為什麼？** 有，v1 → v2：\n1. 新增關卡 1（ingest 時驗證數字），新增 `claims.json` 帳本與驗證狀態。\n2. 新增 `check.py`，讓關卡 2、3 變成機械檢查；簡報每頁要宣告 `data-claims`。\n3. 關卡 3 失敗時分兩種退回：該頁的問題只重生成該頁，帳本缺漏則退回 ingest。第 1 次簡報檢查就用到這個分流（12 個退回帳本、2 個退回簡報）。\n4. 還沒解決的問題：語意是否講歪仍靠人工抽查。下一版可以讓關卡 3 另外叫一個沒看過生成過程的檢查者，逐頁把「頁面文字」與「claim 原文」比對。"}, "claims": {"title": "主張帳本", "path": "claims.json", "desc": "", "md": ""}}, "order": ["index", "schema", "kv-cache", "memory-and-paging", "prefix-caching", "non-prefix-reuse", "api-prompt-caching", "terminology", "s1-pagedattention-vllm", "s2-sglang-radixattention", "s3-prompt-cache", "s4-cacheblend", "s5-anthropic-prompt-caching", "s6-vllm-automatic-prefix-caching", "conflicts", "log", "graph", "run-001"], "groups": [{"title": "開始", "ids": ["index", "schema"]}, {"title": "概念頁", "ids": ["kv-cache", "memory-and-paging", "prefix-caching", "non-prefix-reuse", "api-prompt-caching", "terminology"]}, {"title": "來源頁", "ids": ["s1-pagedattention-vllm", "s2-sglang-radixattention", "s3-prompt-cache", "s4-cacheblend", "s5-anthropic-prompt-caching", "s6-vllm-automatic-prefix-caching"]}, {"title": "品質控管", "ids": ["claims", "conflicts", "log"]}, {"title": "流程與反思", "ids": ["graph", "run-001"]}], "claims": [{"id": "C01", "source": "S3", "status": "full-text", "text": "KV Cache：每個 token 的 K、V 只算一次並重用", "numbers": []}, {"id": "C02", "source": "S3", "status": "full-text", "text": "不快取時每一步以整個 prompt 加已生成 tokens 當輸入，attention states 重算", "numbers": []}, {"id": "C03", "source": "S3", "status": "full-text", "text": "先對輸入算好 K、V（prefill），之後每步只算新 token（decode）", "numbers": []}, {"id": "C04", "source": "S3", "status": "full-text", "text": "因果語言模型使用 KV cache 不影響準確度", "numbers": []}, {"id": "C05", "source": "S2", "status": "full-text", "text": "KV cache 只依賴前面的 tokens，相同 prefix 可重用", "numbers": []}, {"id": "C06", "source": "S1", "status": "snippet", "text": "13B 模型在 40GB A100 上約 65% 記憶體是權重", "numbers": ["13B rce": "S5", "status": "full-text", "text": "預設壽命 5 分鐘，命中免費刷新；可選 1 小時", "numbers": ["5", "1"]}, {"id": "C21", "source": "S5", "status": "full-text", "text": "5 分鐘寫入 1.25×、1 小時寫入 2×、讀取一般 0.1×（部分模型更低）", "numbers": ["1.25×", "2×", "0.1×", "0.05×", "0.025×"]}, {"id": "C22", "source": "S5", "status": "full-text", "text": "最小可快取長度 512–4,096 tokens（依模型）；太短不快取也不報錯；用 usage 欄位判斷", "numbers": ["512", "4,096"]}, {"id": "C23", "source": "S5", "status": "full-text", "text": "prefix 須 100% 相同；改 tool 定義讓整個快取失效；breakpoint 放最後一個穩定 block；最多 4 個", "numbers": ["100%", "4"]}, {"id": "C24", "source": "S5", "status": "full-text", "text": "快取不影響輸出", "numbers": []}, {"id": "C25", "source": "S3", "status": "full-text", "text": "Prompt Cache：用 schema（PML）定義 prompt modules 預先算 attention states；LLM 能處理不連續 position IDs", "numbers": []}, {"id": "C26", "source": "S3", "status": "full-text", "text": "只降 TTFT：4090、Llama 7B、3K context，TTFT 900ms→90ms，每 token 約 32ms", "numbers": ["900", "90", "32", "3K", "4090", "7B"]}, {"id": "C27", "source": "S3", "status": "full-text", "text": "TTFT 改善：摘要 GPU 最高 8×、CPU 最高 60×；§5.2 為 GPU 1.5×–10×、CPU 20×–70×", "numbers": ["8×", "60×", "1.5×", "10×", "20×", "70×", "1.5×–10×", "20×–70×"]}, {"id": "C28", "source": "S3", "status": "full-text", "text": "各 module 獨立編碼，跨 module attention 被遮蔽，語意相依時品質可能變差", "numbers": []}, {"id": "C29", "source": "S4", "status": "full-text", "text": "prefix caching 只能重用開頭；RAG 多 chunk 只有第一個是 prefix；full KV reuse 忽略 cross-attention", "numbers": []}, {"id": "C30", "source": "S4", "status": "full-text", "text": "CacheBlend：選擇性重算 HKVD tokens，預設約 15%，10–20% 通常足夠；與載入 pipeline 重疊", "numbers": ["15%", "10–20%"]}, {"id": "C31", "source": "S4", "status": "full-text", "text": "相較 full KV recompute：TTFT 降 2.2–3.3×、吞吐升 2.8–5×、品質降不超過 0.01–0.03；吞吐最多比 prefix caching 高 3.3×", "numbers": ["2.2–3.3×", "2.8–5×", "0.01–0.03", "3.3×"]}, {"id": "C32", "source": "S4", "status": "full-text", "text": "三個模型（Mistral-7B、Yi-34B、Llama-70B）、四個資料集，實作於 vLLM", "numbers": ["3", "   if(window.matchMedia('(max-width:800px)').matches){ navd.open = false; }

  if(DECK.indexOf('http') === 0){
    var a = document.createElement('a'); a.href = DECK; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '開啟教學簡報 →';
    document.getElementById('deckLink').appendChild(a);
  }

  // sidebar
  D.groups.forEach(function(g){
    var h = document.createElement('h4'); h.textContent = g.title; navlist.appendChild(h);
    g.ids.forEach(function(id){
      var a = document.createElement('a'); a.href = '#' + id; a.dataset.id = id; a.textContent = pages[id] ? pages[id].title : id; navlist.appendChild(a);
    });
  });

  function pre(md){
    md = md.replace(/\[\[([a-z0-9-]+)\]\]/g, '[$1](#$1)');
    md = md.replace(/\]\((?:[a-z]+\/)?([a-z0-9-]+)\.md\)/g, '](#$1)').replace(/\]\(claims\.json\)/g, '](#claims)');
    md = md.replace(/\[(C\d{2})\]/g, '[$1](#$1)');
    md = md.replace(/\[(S\d)\]/g, function(m, s){ return srcMap[s] ? '[' + s + '](#' + srcMap[s] + ')' : m; });
    return md;
  }
  function wrapTables(root){
    root.querySelectorAll('table').forEach(function(t){
      if(t.parentNode.className === 'tw') return;
      var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }
  function setNav(id){
    navlist.querySelectorAll('a').forEach(function(a){ a.classList.toggle('on', a.dataset.id === id); });
  }
  var FLOW = document.getElementById('flowTpl');

  function renderPage(id){
    var p = pages[id]; if(!p){ id = 'index'; p = pages[id]; }
    main.innerHTML = '';
    var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = p.path; main.appendChild(meta);
    if(p.desc){ var d = document.createElement('p'); d.className = 'desc'; d.textContent = p.desc; main.appendChild(d); }
    var body = document.createElement('div'); body.innerHTML = marked.parse(pre(p.md)); main.appendChild(body);
    wrapTables(body);
    if(id === 'graph'){
      var tpl = document.getElementById('flowTpl');
      var h1 = body.querySelector('h1'); var box = document.createElement('div'); box.className = 'flow'; box.innerHTML = tpl.innerHTML;
      if(h1 && h1.nextSibling){ body.insertBefore(box, h1.nextSibling); } else { body.appendChild(box); }
    }
    setNav(id); document.title = p.title + ' · KV Cache LLM Wiki';
  }

  var filter = 'all';
  function renderClaims(hl){
    main.innerHTML = '';
    var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'claims.json'; main.appendChild(meta);
    var h = document.createElement('h1'); h.textContent = '主張帳本（claim ledger）'; main.appendChild(h);
    var p = document.createElement('p'); p.className = 'desc';
    p.textContent = '每個 claim 都有來源與驗證狀態。簡報每一頁底部的 C## 對應這裡。full-text＝已讀一手全文；snippet＝一手原文片段；extract-only＝只有工具擷取摘要，簡報不得使用；derived＝Wiki 自己的整理。';
    main.appendChild(p);
    var f = document.createElement('div'); f.className = 'filters';
    ['all','full-text','snippet','extract-only','derived'].forEach(function(s){
      var b = document.createElement('button'); b.textContent = s === 'all' ? '全部（' + claims.length + '）' : s; b.setAttribute('aria-pressed', filter === s);
      b.onclick = function(){ filter = s; renderClaims(); }; f.appendChild(b);
    });
    main.appendChild(f);
    var tw = document.createElement('div'); tw.className = 'tw';
    var t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>ID</th><th>來源</th><th>狀態</th><th>內容</th><th>可用數字</th></tr></thead>';
    var tb = document.createElement('tbody');
    claims.forEach(function(c){
      if(filter !== 'all' && c.status !== filter) return;
      var tr = document.createElement('tr'); tr.id = 'row-' + c.id;
      var cls = c.status === 'full-text' ? 'b-full' : c.status === 'snippet' ? 'b-snip' : c.status === 'extract-only' ? 'b-ext' : 'b-der';
      var td = function(txt){ var x = document.createElement('td'); x.textContent = txt; return x; };
      tr.appendChild(td(c.id)); tr.cells[0].style.fontFamily = 'var(--mono)';
      tr.appendChild(td(c.source));
      var st = document.createElement('td'); var sp = document.createElement('span'); sp.className = 'badge ' + cls; sp.textContent = c.status; st.appendChild(sp); tr.appendChild(st);
      tr.appendChild(td(c.text));
      var n = td((c.numbers || []).join('、')); n.style.fontFamily = 'var(--mono)'; n.style.fontSize = '.8rem'; tr.appendChild(n);
      if(hl === c.id) tr.className = 'hl';
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); main.appendChild(tw);
    setNav('claims'); document.title = '主張帳本 · KV Cache LLM Wiki';
    if(hl){ var r = document.getElementById('row-' + hl); if(r){ r.scrollIntoView({block:'center'}); } }
  }

  function route(){
    var h = (location.hash || '#index').slice(1);
    if(/^C\d{2}$/.test(h)){ if(filter !== 'all'){ filter = 'all'; } renderClaims(h); return; }
    if(h === 'claims'){ renderClaims(); window.scrollTo(0,0); return; }
    renderPage(h); window.scrollTo(0,0);
    if(window.matchMedia('(max-width:800px)').matches){ navd.open = false; }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
